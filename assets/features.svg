      <text class="f s" x="20" y="97">groups, channel tabs, import/export</text>
    </g>
    <g transform="translate(610,192)">
      <rect width="253" height="102" rx="12" fill="#161e2b"/>
      <circle cx="38" cy="38" r="18" fill="#3fb950" opacity=".16"/>
      <g class="g" stroke="#3fb950"><path d="M38 28v12"/><path d="M33 35l5 5 5-5"/><path d="M28 46h20"/></g>
      <text class="f t" x="20" y="80">Downloads</text>
      <text class="f s" x="20" y="97">video, audio, subtitle; resumable</text>
    </g>
    <g transform="translate(883,192)">
      <rect width="253" height="102" rx="12" fill="#161e2b"/>
      <circle cx="38" cy="38" r="18" fill="#E8413F" opacity=".16"/>
      <g class="g" stroke="#E8413F"><path d="M27 30h13M27 36h13M27 42h7"/><circle cx="44" cy="42" r="6"/><path d="M44 39v3l2 1.6"/></g>
      <text class="f t" x="20" y="80">Playlists &amp; watch history</text>
      <text class="f s" x="20" y="97">watch counts, resume points, bookmarks</text>
    </g>

    <!-- row 3 -->
    <g transform="translate(64,310)">
      <rect width="253" height="102" rx="12" fill="#161e2b"/>
      <circle cx="38" cy="38" r="18" fill="#F2706D" opacity=".16"/>
      <g class="g" stroke="#F2706D"><path d="M27 45l7-8 5 4 9-11"/><path d="M41 30h7v7"/></g>
      <text class="f t" x="20" y="80">Kiosks &amp; front-page tabs</text>
      <text class="f s" x="20" y="97">10 tab types: trending, charts, more</text>
    </g>
    <g transform="translate(337,310)">
      <rect width="253" height="102" rx="12" fill="#161e2b"/>
      <circle cx="38" cy="38" r="18" fill="#a371f7" opacity=".16"/>
      <g class="g" stroke="#a371f7"><rect x="27" y="29" width="22" height="15" rx="3"/><path d="M34 44l-3 5 7-5"/></g>
      <text class="f t" x="20" y="80">Comments &amp; replies</text>
      <text class="f s" x="20" y="97">paginated replies, author and links</text>
    </g>
    <g transform="translate(610,310)">
      <rect width="253" height="102" rx="12" fill="#161e2b"/>
      <circle cx="38" cy="38" r="18" fill="#d29922" opacity=".16"/>
      <g class="g" stroke="#d29922"><circle cx="38" cy="38" r="4.5"/><path d="M38 28v3.5M38 44.5V48M28 38h3.5M44.5 38H48M30.9 30.9l2.5 2.5M42.6 42.6l2.5 2.5M45.1 30.9l-2.5 2.5M33.4 42.6l-2.5 2.5"/></g>
      <text class="f t" x="20" y="80">Settings &amp; backup</text>
      <text class="f s" x="20" y="97">16 screens, 88 fuzzy rows, zip backup</text>
    </g>
    <g transform="translate(883,310)">
      <rect width="253" height="102" rx="12" fill="#161e2b"/>
      <circle cx="38" cy="38" r="18" fill="#f778ba" opacity=".16"/>
      <g class="g" stroke="#f778ba"><circle cx="38" cy="38" r="9"/><path d="M29 38h18"/><path d="M38 29c4 4.5 4 13.5 0 18c-4-4.5-4-13.5 0-18z"/></g>
      <text class="f t" x="20" y="80">91 locales &amp; theming</text>
      <text class="f s" x="20" y="97">light and dark, 5 service accents</text>
    </g>
